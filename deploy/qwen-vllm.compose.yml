services:
  qwen3-vl-4b:
    image: vllm/vllm-openai:v0.14.1
    container_name: camangle-qwen3-vl-4b
    restart: unless-stopped
    gpus: all
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${QWEN_MODEL_PATH}:/model:ro
    command:
      - /model
      - --served-model-name
      - Qwen3-VL-4B-Instruct-AWQ-4bit
      - --max-model-len
      - "8192"
      - --gpu-memory-utilization
      - "0.95"
      - --max-num-seqs
      - "24"
      - --trust-remote-code
      - --disable-log-requests
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"
